<script>
const DATA = {"eras":["2013–2015","2017","2018–2019","2020–2021","2022","2023 上","2023 下","2024+"],"categories":{"foundation":{"name":"前置基础","color":"#79c0ff","bg":"#0c2a4a"},"attention":{"name":"Seq2Seq与注意力","color":"#56d364","bg":"#0a2d15"},"transformer":{"name":"Transformer架构","color":"#f78166","bg":"#3d1100"},"bert":{"name":"BERT系列","color":"#d2a8ff","bg":"#2d0c4a"},"gpt":{"name":"GPT系列","color":"#ffa657","bg":"#3d2000"},"scaling":{"name":"规模化定律","color":"#ff7b72","bg":"#3d1010"},"efficiency":{"name":"高效Transformer","color":"#7ee787","bg":"#0a2d10"},"alignment":{"name":"对齐与RLHF","color":"#f0e68c","bg":"#2d2d00"},"opensource":{"name":"开源模型","color":"#63e2c6","bg":"#003d30"},"application":{"name":"应用与涌现","color":"#ff9f9f","bg":"#3d1010"},"agent":{"name":"Agent 设计范式","color":"#e879f9","bg":"#3d0050"},"prompting":{"name":"Prompt 工程","color":"#fb923c","bg":"#3d1a00"},"context":{"name":"Context 工程","color":"#38bdf8","bg":"#001e3d"},"frontier":{"name":"前沿进展","color":"#c9d1d9","bg":"#1e2530"}},"papers":[{"id":"word2vec","title":"Word2Vec","fullTitle":"Efficient Estimation of Word Representations in Vector Space","authors":"Mikolov et al.","year":2013,"venue":"ICLR 2013","category":"foundation","era":0,"laneY":0,"importance":5,"level":"must","deps":[],"arxiv":"https://arxiv.org/abs/1301.3781","abstract":"词向量嵌入的奠基之作，首次大规模展示词语的分布式语义表示。Skip-gram 和 CBOW 两种训练目标至今影响深远。","contributions":["提出 Skip-gram 和 CBOW 两种高效词向量训练架构","首次展示词向量空间的线性代数关系 (king - man + woman ≈ queen)","词向量作为预训练表示进入 NLP 主流工作流"],"prerequisites":["线性代数","概率论","神经网络基础"],"keyFormula":"Skip-gram: max Σ log p(w_c | w_t)"},{"id":"seq2seq","title":"Seq2Seq","fullTitle":"Sequence to Sequence Learning with Neural Networks","authors":"Sutskever et al.","year":2014,"venue":"NeurIPS 2014","category":"foundation","era":0,"laneY":1,"importance":5,"level":"must","deps":[],"arxiv":"https://arxiv.org/abs/1409.3215","abstract":"提出 Encoder-Decoder 框架处理序列到序列问题，为机器翻译和 NLP 生成任务奠定范式。","contributions":["提出通用的 Encoder-Decoder 序列建模框架","首次将 LSTM 用于端到端机器翻译","逆序输入技巧显著改善长距离依赖"],"prerequisites":["RNN/LSTM","语言模型基础"],"keyFormula":"p(y₁…yₜ | x₁…xₛ) = Π p(yₜ | h, y₁…yₜ₋₁)"},{"id":"attention","title":"Bahdanau Attention","fullTitle":"Neural Machine Translation by Jointly Learning to Align and Translate","authors":"Bahdanau et al.","year":2015,"venue":"ICLR 2015","category":"attention","era":0,"laneY":2,"importance":5,"level":"must","deps":["seq2seq"],"arxiv":"https://arxiv.org/abs/1409.0473","abstract":"提出注意力机制，使解码器能动态关注编码器的不同位置，打破固定长度语义瓶颈，直接催生了 Transformer。","contributions":["提出软注意力 (soft attention) 机制","编解码器之间可微分的动态对齐","注意力权重提供了可解释性窗口"],"prerequisites":["Seq2Seq","微分/反向传播"],"keyFormula":"eᵢⱼ = a(sᵢ₋₁, hⱼ),  αᵢⱼ = softmax(eᵢⱼ)"},{"id":"transformer","title":"Transformer","fullTitle":"Attention Is All You Need","authors":"Vaswani et al.","year":2017,"venue":"NeurIPS 2017","category":"transformer","era":1,"laneY":1,"importance":5,"level":"must","deps":["attention","seq2seq"],"arxiv":"https://arxiv.org/abs/1706.03762","abstract":"彻底放弃 RNN，纯注意力机制构建序列模型。多头自注意力 + 位置编码 + FFN 的设计成为现代 LLM 的基础骨架。","contributions":["多头自注意力 (Multi-Head Self-Attention)","位置编码 (Positional Encoding)","残差连接 + Layer Normalization","可并行训练，大幅提升训练速度"],"prerequisites":["Bahdanau Attention","矩阵乘法","残差网络"],"keyFormula":"Attention(Q,K,V) = softmax(QKᵀ/√dₖ)·V"},{"id":"bert","title":"BERT","fullTitle":"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding","authors":"Devlin et al.","year":2018,"venue":"NAACL 2019","category":"bert","era":2,"laneY":2,"importance":5,"level":"must","deps":["transformer"],"arxiv":"https://arxiv.org/abs/1810.04805","abstract":"双向 Transformer 预训练模型，用 MLM (掩码语言模型) 和 NSP 任务学习深度上下文表示，在 11 项 NLP 任务刷新 SOTA，开启预训练 Fine-tune 时代。","contributions":["Masked Language Modeling (MLM) 预训练目标","Next Sentence Prediction (NSP)","双向上下文理解 vs GPT 的单向","Fine-tune 范式统一 NLP 任务"],"prerequisites":["Transformer","语言模型"],"keyFormula":"L_MLM = -Σ log P(xᵢ | x₋ᵢ)"},{"id":"roberta","title":"RoBERTa","fullTitle":"RoBERTa: A Robustly Optimized BERT Pretraining Approach","authors":"Liu et al.","year":2019,"venue":"arXiv 2019","category":"bert","era":2,"laneY":3,"importance":3,"level":"rec","deps":["bert"],"arxiv":"https://arxiv.org/abs/1907.11692","abstract":"系统研究 BERT 训练超参，去掉 NSP、更大 batch、更多数据、动态 Masking，证明 BERT 严重欠训练。","contributions":["消融研究证明 NSP 无益","动态 Masking 策略","更大 batch size 的重要性"],"prerequisites":["BERT"],"keyFormula":"Dynamic masking per epoch"},{"id":"xlnet","title":"XLNet","fullTitle":"XLNet: Generalized Autoregressive Pretraining for Language Understanding","authors":"Yang et al.","year":2019,"venue":"NeurIPS 2019","category":"bert","era":2,"laneY":4,"importance":3,"level":"rec","deps":["bert","transformer"],"arxiv":"https://arxiv.org/abs/1906.08237","abstract":"排列语言模型，结合自回归和双向上下文，引入 Transformer-XL 的相对位置编码，超越 BERT。","contributions":["排列语言建模 (Permutation LM)","两流注意力机制","相对位置编码"],"prerequisites":["BERT","GPT"],"keyFormula":"max_θ Σ E_{z∼Z_T}[Σ log pθ(xzₜ|x_z<t)]"},{"id":"t5","title":"T5","fullTitle":"Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer","authors":"Raffel et al.","year":2019,"venue":"JMLR 2020","category":"bert","era":2,"laneY":5,"importance":4,"level":"must","deps":["bert","gpt1"],"arxiv":"https://arxiv.org/abs/1910.10683","abstract":"把所有 NLP 任务统一为文本到文本格式，用 C4 数据集系统消融预训练策略，提出 T5 框架，是指令微调的重要前驱。","contributions":["Text-to-Text 统一任务范式","C4 (Colossal Clean Crawled Corpus) 数据集","系统消融预训练目标、模型大小、数据量"],"prerequisites":["BERT","GPT"],"keyFormula":"All tasks → \"prefix: input text\" → \"output text\""},{"id":"gpt1","title":"GPT-1","fullTitle":"Improving Language Understanding by Generative Pre-Training","authors":"Radford et al.","year":2018,"venue":"OpenAI Blog 2018","category":"gpt","era":2,"laneY":0,"importance":4,"level":"must","deps":["transformer"],"arxiv":"https://openai.com/research/language-unsupervised","abstract":"第一个基于 Transformer 的大规模无监督语言模型预训练 + 下游任务 Fine-tune 的 GPT 方案。","contributions":["自回归 (Causal) 语言模型预训练","Fine-tune 范式在 12 个任 .14165","abstract":"175B 参数，In-Context Learning 展示了 LLM 的涌现能力。少样本学习无需梯度更新，开启 Prompt Engineering 时代。","contributions":["175B 参数，跨越规模阈值","In-Context Learning (ICL) / Few-shot Prompting","涌现能力 (Emergent Abilities)","开启 LLM API 商业化"],"prerequisites":["GPT-2","Scaling Laws"],"keyFormula":"P(task output | few examples in context)"},{"id":"rlhf","title":"RLHF","fullTitle":"Learning to Summarize with Human Feedback","authors":"Stiennon et al.","year":2020,"venue":"NeurIPS 2020","category":"alignment","era":3,"laneY":2,"importance":5,"level":"must","deps":["gpt3"],"arxiv":"https://arxiv.org/abs/2009.01325","abstract":"奠定 RLHF (人类反馈强化学习) 范式：训练奖励模型捕捉人类偏好，再用 PPO 优化语言模型，是 ChatGPT 的核心技术。","contributions":["人类偏好数据收集框架","奖励模型 (Reward Model) 训练","PPO 优化语言模型","KL 散度约束防止退化"],"prerequisites":["GPT-3","强化学习基础","PPO 算法"],"keyFormula":"R(x,y) - β·KL[π_RL || π_SFT]"},{"id":"rag","title":"RAG","fullTitle":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","authors":"Lewis et al.","year":2020,"venue":"NeurIPS 2020","category":"application","era":3,"laneY":3,"importance":5,"level":"must","deps":["bert","gpt2"],"arxiv":"https://arxiv.org/abs/2005.11401","abstract":"检索增强生成：将密集向量检索与生成模型结合，解决知识截止和幻觉问题，是企业 LLM 应用的主流架构。","contributions":["端到端联合训练检索器和生成器","Dense Passage Retrieval (DPR)","外部知识库无缝集成生成"],"prerequisites":["BERT","GPT","信息检索"],"keyFormula":"p(y|x) = Σ_z p_η(z|x)·p_θ(y|x,z)"},{"id":"rope","title":"RoPE","fullTitle":"RoFormer: Enhanced Transformer with Rotary Position Embedding","authors":"Su et al.","year":2021,"venue":"Neurocomputing 2023","category":"context","era":3,"laneY":4,"importance":5,"level":"must","deps":["transformer"],"arxiv":"https://arxiv.org/abs/2104.09864","abstract":"旋转位置编码：用旋转矩阵将绝对位置信息编码为 QK 相对点积，兼具绝对位置和相对位置的优点，且天然支持外推。是 LLaMA/Mistral/GPT-NeoX 等几乎所有现代 LLM 的位置编码标准。","contributions":["旋转矩阵实现位置的相对性和绝对性统一","与线性 Attention 兼容","成为现代 LLM 位置编码事实标准"],"prerequisites":["Transformer","复数/旋转矩阵","线性代数"],"keyFormula":"f(q,m) = R_Θ^m · q,  ⟨f(q,m), f(k,n)⟩ = g(q,k,m-n)"  the Middle","fullTitle":"Lost in the Middle: How Language Models Use Long Contexts","authors":"Liu et al.","year":2023,"venue":"TACL 2024","category":"context","era":6,"laneY":9,"importance":5,"level":"must","deps":["gpt4","rag"],"arxiv":"https://arxiv.org/abs/2307.03172","abstract":"实证研究揭示：LLM 对上下文首尾位置的内容利用最佳（U 型曲线），中间位置的信息常被\"遗忘\"。","contributions":["首次系统量化 LLM 对位置偏好的 U 型效应","最重要信息应放在上下文首部或尾部","为 RAG reranking、chunk 排序策略提供理论依据"],"prerequisites":["GPT-4","RAG","In-Context Learning"],"keyFormula":"perf(pos) ≈ U-shape: high at start & end, low in middle"},{"id":"deepseek_r1","title":"DeepSeek-R1","fullTitle":"DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning","authors":"DeepSeek AI","year":2025,"venue":"arXiv 2025","category":"frontier","era":7,"laneY":0,"importance":5,"level":"must","deps":["dpo","llama2","cot"],"arxiv":"https://arxiv.org/abs/2501.12948","abstract":"纯强化学习涌现出 Chain-of-Thought 推理能力，DeepSeek-R1 与 OpenAI o1 在推理基准上竞争，并以极低成本实现，震惊 AI 产业。","contributions":["纯 RL 训练涌现 CoT 推理 (无 SFT)","GRPO 算法替代 PPO","MIT 许可证开源，颠覆竞争格局"],"prerequisites":["DPO/RLHF","Chain-of-Thought","LLaMA 2"],"keyFormula":"GRPO: group relative policy optimization"},{"id":"qwen","title":"Qwen 系列","fullTitle":"Qwen2.5: A Party of Foundation Models","authors":"Qwen Team (Alibaba)","year":2024,"venue":"arXiv 2024","category":"frontier","era":7,"laneY":1,"importance":4,"level":"rec","deps":["llama2","mistral"],"arxiv":"https://arxiv.org/abs/2412.15115","abstract":"阿里通义千问开源系列，Qwen2.5 在代码、数学、多语言上表现优异，支持 128K 上下文，MoE 版本效率突出。","contributions":["18T token 高质量预训练数据","128K 上下文长度","代码和数学专用子模型"],"prerequisites":["LLaMA 2","Mistral"],"keyFormula":"GQA + RoPE + SwiGLU at scale"},{"id":"swe_agent","title":"SWE-agent","fullTitle":"SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering","authors":"Yang et al. (Princeton)","year":2024,"venue":"arXiv 2024","category":"agent","era":7,"laneY":2,"importance":5,"level":"must","deps":["react","gpt4","toolformer"],"arxiv":"https://arxiv.org/abs/2405.15793","abstract":"专为软件工程设计的 Agent-Computer Interface (ACI)，通过结构化文件浏览、编辑、测试命令，让 GPT-4 在 SWE-bench 上解决真实 GitHub Issues。","contributions":["Agent-Computer Interface (ACI) 设计原则","专用文件查看/编辑工具显著提升成功率","SWE-bench 上前沿水平的突破"],"prerequisites":["ReAct","GPT-4","Toolformer","软件工程基础"],"keyFormula":"ACI: structured edit(file,old,new) + bash(cmd)"}]};

/* ================= 布局常量 ================= */
const NODE_W = 132, NODE_H = 58, LANE_H = 70, TOP = 96;
const ERA_X = [130, 320, 520, 730, 940, 1150, 1370, 1590];
const LEVELS = {
  must: { label: "必读", color: "#f85149" },
  rec:  { label: "推荐", color: "#d29922" },
  adv:  { label: "进阶", color: "#3fb950" },
};

/* ================= 数据预处理 ================= */
const papers = DATA.papers;
const byId = {};
papers.forEach(p => {
  p.x = ERA_X[p.era];
  p.y = TOP + p.laneY * LANE_H;
  byId[p.id] = p;
  p.dependents = [];
});
papers.forEach(p => p.deps.forEach(d => byId[d] && byId[d].dependents.push(p.id)));

const maxLane = Math.max(...papers.map(p => p.laneY));
const CONTENT = {
  x: Math.min(...ERA_X) - 150, y: 0,
  w: Math.max(...ERA_X) - Math.min(...ERA_X) + 300,
  h: TOP + maxLane * LANE_H + NODE_H + 60,
};

const SVGNS = "http://www.w3.org/2000/svg";
const $ = sel => document.querySelector(sel);
function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

/* ================= 渲染：时间轴 ================= */
const erasG = $("#eras");
DATA.eras.forEach((label, i) => {
  const t = el("text", { class: "era-label", x: ERA_X[i], y: 56 }, erasG);
  t.textContent = label;
  el("line", { class: "era-line", x1: ERA_X[i], y1: 70,
    x2: ERA_X[i], y2: CONTENT.h, "stroke-width": i === 0 ? 0 : 1,
    transform: `translate(${-95},0)` }, erasG);
});

/* ================= 渲染：依赖边 ================= */
const edgesG = $("#edges");
const edgeEls = [];
papers.forEach(p => p.deps.forEach(d => {
  const s = byId[d]; if (!s) return;
  const x1 = s.x + NODE_W / 2, y1 = s.y + NODE_H / 2;
  const x2 = p.x - NODE_W / 2 - 4, y2 = p.y + NODE_H / 2;
  const mx = (x1 + x2) / 2;
  const path = el("path", {
    class: "edge", d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,
    "marker-end": "url(#arrow)",
  }, edgesG);
  edgeEls.push({ from: s.id, to: p.id, el: path });
}));

/* ================= 渲染：论文节点 ================= */
const nodesG = $("#nodes");
const nodeEls = {};
papers.forEach(p => {
  const cat = DATA.categories[p.category];
  const lv = LEVELS[p.level];
  const g = el("g", { class: "node", transform: `translate(${p.x - NODE_W/2},${p.y})` }, nodesG);
  el("rect", { class: "body", width: NODE_W, height: NODE_H, rx: 7, ry: 7,
    fill: cat.bg, stroke: cat.color }, g);
  const title = el("text", { class: "t", x: NODE_W / 2, y: 21, fill: cat.color }, g);
  title.textContent = trunc(p.title, 15);
  const sub = el("text", { class: "s", x: NODE_W / 2, y: 37 }, g);
  sub.textContent = trunc(`${p.authors} · ${p.year}`, 24);
  const lvT = el("text", { class: "lv", x: NODE_W - 7, y: 11, fill: lv.color }, g);
  lvT.textContent = lv.label;
  for (let i = 0; i < 5; i++) {  // 重要性圆点
    el("circle", { cx: NODE_W / 2 - 14 + i * 7, cy: 49, r: 2.4,
      fill: i < p.importance ? cat.color : "#333",
      opacity: i < p.importance ? .9 : .3 }, g);
  }
  g.addEventListener("mouseenter", () => highlightDeps(p.id));
  g.addEventListener("mouseleave", clearHighlight);
  g.addEventListener("click", e => {
    e.stopPropagation();
    if (suppressClick) { suppressClick = false; return; }  // 刚拖拽完，忽略
    selectPaper(p.id, false);
  });
  nodeEls[p.id] = g;
});

/* ================= 搜索/图例过滤状态 ================= */
let searchQ = "", legendCat = null;
function applyNodeFilter() {
  const active = !!searchQ || !!legendCat;
  papers.forEach(p => {
    let on = true;
    if (searchQ) on = (p.title + p.fullTitle + p.authors).toLowerCase().includes(searchQ);
    if (on && legendCat) on = p.category === legendCat;
    nodeEls[p.id].classList.toggle("hi", active && on);
    nodeEls[p.id].classList.toggle("dim", active && !on);
  });
}

/* ================= 悬停高亮依赖链 ================= */
function highlightDeps(id) {
  const related = new Set([id, ...byId[id].deps, ...byId[id].dependents]);
  edgeEls.forEach(e => {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle("hi", on);
    e.el.classList.toggle("dim", !on);
    e.el.setAttribute("marker-end", on ? "url(#arrowHi)" : "url(#arrow)");
  });
  papers.forEach(p => nodeEls[p.id].classList.toggle("dim", !related.has(p.id)));
}
function clearHighlight() {
  edgeEls.forEach(e => {
    e.el.classList.remove("hi", "dim");
    e.el.setAttribute("marker-end", "url(#arrow)");
  });
  applyNodeFilter();   // 恢复搜索/图例过滤状态，而不是简单清空
}

/* ================= 缩放 / 平移 ================= */
const stage = $("#stage"), viewport = $("#viewport");
let view = { x: 0, y: 0, k: 1 };
function applyView() {
  viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = Math.exp(-e.deltaY * 0.0016);
  const k = Math.min(3, Math.max(0.15, view.k * factor));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, { passive: false });

let drag = null, suppressClick = false;
stage.addEventListener("pointerdown", e => {
  suppressClick = false;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y,
    moved: false, onNode: !!e.target.closest(".node") };
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  view.x = drag.vx + dx; view.y = drag.vy + dy;
  applyView();
});
stage.addEventListener("pointerup", () => {
  if (drag && drag.moved) suppressClick = true;          // 拖拽平移后不触发节点点击
  if (drag && !drag.moved && !drag.onNode) closePanel(); // 点击空白处关闭面板
  drag = null;
  stage.classList.remove("dragging");
});

function fitView() {
  const rect = stage.getBoundingClientRect();
  const k = Math.min(rect.width / CONTENT.w, rect.height / CONTENT.h, 1.2) * 0.96;
  view.k = k;
  view.x = (rect.width - CONTENT.w * k) / 2 - CONTENT.x * k;
  view.y = (rect.height - CONTENT.h * k) / 2 - CONTENT.y * k + 10;
  applyView();
}
$("#fitBtn").addEventListener("click", fitView);
window.addEventListener("resize", fitView);

function panToPaper(p) {
  const rect = stage.getBoundingClientRect();
  if (view.k < 0.7) view.k = 0.9;
  view.x = rect.width / 2 - p.x * view.k - 180;
  view.y = rect.height / 2 - (p.y + NODE_H / 2) * view.k;
  applyView();
}

/* ================= 详情面板 ================= */
const panel = $("#panel"), panelBody = $("#panelBody");
let selectedId = null;
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function selectPaper(id, pan = true) {
  if (selectedId === id && panel.classList.contains("open")) { closePanel(); return; }
  selectedId = id;
  const p = byId[id], cat = DATA.categories[p.category], lv = LEVELS[p.level];
  const chip = (pid, label) =>
    `<span class="chip" data-id="${pid}">${esc(label || byId[pid].title)}</span>`;
  panelBody.innerHTML = `
    <div class="badges">
      <span class="badge" style="color:${cat.color};border-color:${cat.color};background:${cat.color}1f">${cat.name}</span>
      <span class="badge" style="color:${lv.color};border-color:${lv.color};background:${lv.color}1f">${lv.label}</span>
    </div>
    <h2>${esc(p.fullTitle)}</h2>
    <div class="meta-row">
      <span>👥 ${esc(p.authors)}</span>
      <span>📅 ${p.year}</span>
      <span>🏛 ${esc(p.venue)}</span>
    </div>
    <h4>摘要</h4><p class="abs">${esc(p.abstract)}</p>
    ${p.keyFormula ? `<h4>核心公式 / 关键思想</h4><div class="formula">${esc(p.keyFormula)}</div>` : ""}
    <h4>主要贡献</h4><ul>${p.contributions.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    ${p.prerequisites?.length ? `<h4>阅读前置要求</h4><ul>${
      p.prerequisites.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    ${p.deps.length ? `<h4>依赖论文</h4><div class="chips">${p.deps.map(d => chip(d)).join("")}</div>` : ""}
    ${p.dependents.length ? `<h4>后续延伸</h4><div class="chips">${p.dependents.map(d => chip(d)).join("")}</div>` : ""}
    <a class="arxiv" href="${p.arxiv}" target="_blank" rel="noopener">📄 arXiv / 原文</a>`;
  panelBody.querySelectorAll(".chip[data-id]").forEach(c =>
    c.addEventListener("click", () => selectPaper(c.dataset.id)));
  panel.classList.add("open");
  if (pan) panToPaper(p);
}
function closePanel() { panel.classList.remove("open"); selectedId = null; }
$("#closeBtn").addEventListener("click", closePanel);

/* ================= 搜索 ================= */
$("#search").addEventListener("input", e => {
  searchQ = e.target.value.trim().toLowerCase();
  applyNodeFilter();
  if (searchQ) {
    const first = papers.find(p =>
      (p.title + p.fullTitle + p.authors).toLowerCase().includes(searchQ));
    if (first) panToPaper(first);
  }
});

/* ================= 图例 ================= */
const legend = $("#legend");
Object.entries(DATA.categories).forEach(([key, cat]) => {
  const item = document.createElement("div");
  item.className = "item";
  item.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.name}`;
  item.addEventListener("click", () => {
    const active = item.classList.toggle("on");
    legend.querySelectorAll(".item.on").forEach(n => n !== item && n.classList.remove("on"));
    legendCat = active ? key : null;
    applyNodeFilter();
  });
  legend.appendChild(item);
});

/* ================= 启动 ================= */
fitView();
</script>
</body>
</html>
